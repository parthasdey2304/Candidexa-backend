name: Backend CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx ruff pip-audit

      - name: Compile check
        run: python -m compileall main.py app

      - name: Import check
        run: python -c "from main import app; print(app.title)"

      - name: Lint with Ruff
        run: ruff check .

      - name: Dependency audit
        run: pip-audit

      - name: Run tests
        run: pytest -q
        env:
          ENVIRONMENT: test
          JWT_SECRET: test-secret-key-for-testing-only-32chars
          JWT_ALGORITHM: HS256
          DATABASE_URL: sqlite:///./test.db
          SUPABASE_URL: http://localhost:54321
          SUPABASE_ANON_KEY: test-anon-key
          SUPABASE_SERVICE_ROLE_KEY: test-service-role-key
          GEMINI_API_KEY: test-gemini-key
          MISTRAL_API_KEY: test-mistral-key
          FRONTEND_ORIGINS: http://localhost:3000
          REDIS_URL: redis://localhost:6379/0

  docker:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: candidexa-backend:latest
          load: true

      - name: Test Docker image
        run: |
          docker run --rm -d --name candidexa-test -p 8000:8000 \
            -e ENVIRONMENT=test \
            -e JWT_SECRET=test-secret-key-for-testing-only-32chars \
            -e DATABASE_URL=sqlite:///./test.db \
            -e SUPABASE_URL=http://localhost:54321 \
            -e SUPABASE_ANON_KEY=test-anon-key \
            -e SUPABASE_SERVICE_ROLE_KEY=test-service-role-key \
            -e FRONTEND_ORIGINS=http://localhost:3000 \
            candidexa-backend:latest
          sleep 5
          curl -f http://localhost:8000/health
          curl -f http://localhost:8000/ready
          docker stop candidexa-test