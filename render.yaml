# Render Blueprint for Candidexa Backend
# Deploy with: render blueprint apply render.yaml
# Secrets must be added via Render Dashboard > Environment

services:
  - type: web
    name: candidexa-backend
    runtime: python
    plan: starter
    region: oregon
    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: FRONTEND_ORIGINS
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "15"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "7"
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: MISTRAL_API_KEY
        sync: false
      - key: MISTRAL_MODEL
        value: mistral-small
      - key: REDIS_URL
        sync: false
      - key: AI_REQUESTS_PER_MINUTE
        value: "10"
      - key: AI_REQUESTS_PER_DAY
        value: "50"
      - key: AI_TIMEOUT_SECONDS
        value: "30"
      - key: AI_MAX_INPUT_CHARS
        value: "20000"
      - key: AI_DAILY_TOKEN_LIMIT
        value: "10000"
      - key: AI_MONTHLY_TOKEN_LIMIT
        value: "100000"
      - key: MAX_RESUME_SIZE_MB
        value: "10"
      - key: MAX_JSON_BODY_MB
        value: "1"
      - key: LOG_LEVEL
        value: INFO
      - key: APP_VERSION
        value: "0.1.0"
      - key: FIELD_ENCRYPTION_KEY
        sync: false
      - key: FIELD_BLIND_INDEX_KEY
        sync: false